# The Debian island (phoc on the GPU through libhybris), built from public
# sources under qemu (ci/island.sh, ADR 0003) and released on its own: the
# image build takes the one linux-port/hybris/island.lock names. Rebuilt
# rarely, by an island-* tag (a release needs a tag pushed by a person:
# GITHUB_TOKEN may not create one); Run workflow by hand builds and keeps
# the archive as an artifact for a week.
# Two stages: the base (Debian, build dependencies, libhybris, sources) is
# cached by the hash of what makes it, so a change to phoc's patch or to
# the trim rebuilds only phoc.
name: island
on:
  workflow_dispatch:
  push:
    tags: ["island-*"]
permissions:
  contents: write
jobs:
  island:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache
          df -h /
      - name: The base's key
        id: key
        run: |
          # Everything up to the chroot build in ci/island.sh, the libhybris
          # build and the build environment.
          h=$( (sed -n '1,/^log "build libhybris/p' ci/island.sh; cat linux-port/hybris/build-hybris.sh linux-port/hybris/tlspad.c ci/Dockerfile) | sha256sum | cut -c1-16)
          echo "key=island-base-$h" >> "$GITHUB_OUTPUT"
      - name: Cached base
        id: base
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/b8000h/island-base.tar.zst
          key: ${{ steps.key.outputs.key }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm
      - name: The build environment
        uses: ./.github/actions/build-env
      - name: The base
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/b8000h"
          docker run --rm --privileged -e JOBS=4 -e ISLAND_STAGE=base -v "$PWD:/src" -v "$RUNNER_TEMP/b8000h:/opt/b8000h" \
            b8k-build sh /src/ci/island.sh
      - name: Keep the base
        if: steps.base.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/b8000h/island-base.tar.zst
          key: ${{ steps.key.outputs.key }}
      - name: Build the island
        run: |
          docker run --rm --privileged -e JOBS=4 -v "$PWD:/src" -v "$RUNNER_TEMP/b8000h:/opt/b8000h" \
            b8k-build sh -c 'rm -rf /opt/b8000h/g5 && mkdir -p /opt/b8000h/g5 &&
              tar -C /opt/b8000h/g5 -I zstd -xpf /opt/b8000h/island-base.tar.zst --numeric-owner &&
              sh /src/ci/island.sh'
      - name: The archive of a run without a tag
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b8000h-island
          path: ${{ runner.temp }}/b8000h/dist/b8000h-island.tar.gz
          compression-level: 0
          retention-days: 7
      - name: The release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          f=$RUNNER_TEMP/b8000h/dist/b8000h-island.tar.gz
          sum=$(sha256sum "$f" | cut -d' ' -f1)
          line="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/b8000h-island.tar.gz $sum"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease --title "$tag" \
              --notes "The Debian island for phoc on the GPU (ci/island.sh). Pin it in linux-port/hybris/island.lock: \`$line\`"
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$f" --clobber
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
