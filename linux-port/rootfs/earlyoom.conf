# /etc/conf.d/earlyoom for the B8000-H (1 GB RAM, 512 MB zram swap).
#
# The kernel's own OOM killer acts only when zram is full too, after
# minutes in which the session stands still (Firefox's WebExtensions
# process once grew to 340 MB and froze the screen). earlyoom acts as soon
# as both available memory and free swap run low, and closes one program
# instead.

# Both must be below their minimum: SIGTERM at the first value, SIGKILL at
# the second.
mem_min_percent=10,5
swap_min_percent=20,10

# Browser processes first; never the compositor (phoc runs through the
# Debian loader, so its name is "ld-linux-armhf."), the panel, the
# keyboard or the audio and network daemons. Root processes (power key,
# sshd, NetworkManager) are left alone altogether.
prefer_cmds='^(Web Content|WebExtensions|Isolated Web Co|firefox|epiphany|WebKitWebProces)$'
avoid_cmds='^(ld-linux-armhf\.|phoc|waybar|wvkbd-b8k|pulseaudio|dbus-daemon)$'
command_args="--ignore-root-user -r 0"
