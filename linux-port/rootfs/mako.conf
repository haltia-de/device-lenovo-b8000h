# mako, the shell's notification daemon (b8k-launcher starts it with this
# file). Programs notify the standard way (org.freedesktop.Notifications,
# Gio.Notification); a notification is a large card at the top, in the
# shell's palette, that buzzes the motor once, and a tap on it opens what
# it is about (the program's default action).
font=DejaVu Sans 22
anchor=top-center
layer=overlay
width=760
height=240
margin=16
padding=20
border-size=2
border-color=#3584e4
border-radius=18
background-color=#f2f2f0
text-color=#2e3436
icons=1
max-icon-size=72
icon-path=/usr/local/share/icons/hicolor:/usr/share/icons/hicolor
max-visible=3
default-timeout=12000
on-notify=exec /usr/local/bin/b8k-press notify
on-touch=invoke-default-action
on-button-left=invoke-default-action

[urgency=critical]
default-timeout=0
border-color=#e01b24
