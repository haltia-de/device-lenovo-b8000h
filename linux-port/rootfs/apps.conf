# The programs of the tablet shell itself, one section per id.
# Installed as /usr/local/share/b8k/apps.conf. Programs installed on their
# own (linux-port/apps/*, or any other) add a file with their section to
# /usr/local/share/b8k/apps.d/. b8k-apps merges this file, apps.d/*.conf
# and ~/.config/b8k/apps.conf (one's own programs and sites, same fields)
# into $XDG_RUNTIME_DIR/b8k/apps.conf, which b8k-launch, b8k-focus,
# b8k-ask, b8k-splash, b8k-webapp.js and the programs read. The buttons
# come from ~/.config/b8k/panel, else /usr/local/share/b8k/panel. See
# docs/shell.md.
#
#   label    the name on the panel button and in questions
#   icon     the picture on the button and in b8k-splash (PNG or SVG)
#   signal   above 0: wants a button; one not named in the panel file
#            goes below the others. b8k-apps renumbers the buttons by
#            their place on the panel
#   app_ids  the Wayland app_ids of its windows, space separated
#   exec     its command line, split on spaces (no quoting)
#   env      one VAR=value set for exec
#   url      a web app instead of exec: the page opens in a chromeless
#            Firefox window titled U+2060 + label
#   host     the site such a window may show, subdomains included; other
#            pages go to a normal window

[firefox]
label = Firefox
icon = /usr/share/icons/hicolor/256x256/apps/firefox.png
signal = 1
app_ids = firefox Firefox org.mozilla.firefox
exec = firefox

[calc]
label = Калькулятор
icon = /usr/share/icons/hicolor/scalable/apps/galculator.svg
signal = 2
app_ids = galculator Galculator
exec = galculator
# galculator drops its button font on =, ( and ); this theme puts it back.
env = GTK_THEME=b8k-galculator

# Aisleriot, the GNOME solitaire collection (Alpine package), with a theme
# for fingers: no menu bar or title, a large toolbar and game chooser.
[cards]
label = Пасьянсы
icon = /usr/share/icons/hicolor/256x256/apps/gnome-aisleriot.png
signal = 3
app_ids = sol
exec = sol
env = GTK_THEME=b8k-cards

# In the power menu, not on the panel.
[term]
label = Терминал
icon = /usr/share/icons/hicolor/scalable/apps/foot.svg
signal = 0
app_ids = foot
exec = foot -c /usr/local/share/b8k/foot.ini /usr/local/bin/b8k-term

# Opened by the Wi-Fi indicator.
[settings]
label = Настройки
icon = /usr/share/icons/hicolor/scalable/apps/org.gnome.Settings.svg
signal = 0
app_ids = org.gnome.Settings gnome-control-center
exec = gnome-control-center
