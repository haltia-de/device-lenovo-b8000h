# Terminal for the panel button: text large enough to read and tap at
# arm's length on the 10-inch 1280x800 screen.
[main]
initial-color-theme=light
font=monospace:size=18
pad=10x10

[scrollback]
lines=2000

# b8k palette: light content like the other programs.
[colors-light]
foreground=2e3436
background=f2f2f0
regular0=241f31
regular1=c01c28
regular2=26a269
regular3=a2734c
regular4=1c71d8
regular5=813d9c
regular6=2190a4
regular7=c0bfbc
bright0=5e5c64
bright1=e01b24
bright2=2ec27e
bright3=c64600
bright4=3584e4
bright5=9141ac
bright6=1c8ca8
bright7=f6f5f4
selection-foreground=2e3436
selection-background=99c1f1
cursor=ffffff 3584e4
