; PulseAudio profile set for the B8000-H speaker (card id B8000).
; The hardware "Speaker" control has 8 gain steps, and steps 0-2 crackle.
; PulseAudio moves that control first and does the rest in software, so
; every volume under about 41% crackled. This set keeps the hardware gain
; at the clean top step and leaves the volume to software.
;
; The built-in microphone (MT6320 MIC1) is the input of the same profile: its
; preamp gain is fixed at the top step and PulseAudio scales in software.
; Selected by /etc/udev/rules.d/91-b8k-pulse.rules.

[General]
auto-profiles = no

[Mapping b8k-speaker]
device-strings = hw:%f
channel-map = left,right
; Settings shows the output as "Встроенное аудио (динамик)".
description = (динамик)
paths-output = b8k-speaker
direction = output
priority = 100

[Mapping b8k-mic]
device-strings = hw:%f
channel-map = mono
description = (микрофон)
paths-input = b8k-mic
direction = input
priority = 100

; The name stays "output:b8k-speaker" although it now has an input too, so
; that PulseAudio's saved card profile on installed tablets still matches.
[Profile output:b8k-speaker]
description = Speaker
output-mappings = b8k-speaker
input-mappings = b8k-mic
priority = 100
skip-probe = yes
