# fuzzel as the large question of b8k-ask (installed as
# /usr/local/share/b8k/fuzzel-ask.ini). b8k palette: dark frame, white
# text, the accent for the item under the finger.
[main]
font=DejaVu Sans:size=26
line-height=64
layer=overlay
anchor=center
icons-enabled=no
hide-prompt=yes
minimal-lines=yes
lines=6
width=22
horizontal-pad=32
vertical-pad=28
inner-pad=12

[colors]
background=242424ff
text=ffffffff
match=ffffffff
message=ffffffff
selection=3584e4ff
selection-text=ffffffff
selection-match=ffffffff
border=3a3a3aff

[border]
width=2
radius=16
