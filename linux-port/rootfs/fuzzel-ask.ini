# fuzzel as the large question of b8k-ask (installed as
# /usr/local/share/b8k/fuzzel-ask.ini). b8k palette: dark frame, white
# items. The question is grey so it does not read as one more item, and
# the highlighted item (Отмена at first) is only a lighter row, not the
# accent, which would make it look like the action to take.
[main]
font=DejaVu Sans:size=26
line-height=64
layer=overlay
anchor=center
icons-enabled=no
hide-prompt=yes
minimal-lines=yes
lines=6
width=22
horizontal-pad=32
vertical-pad=28
inner-pad=12

[colors]
background=242424ff
text=ffffffff
match=ffffffff
message=9a9996ff
selection=3a3a3aff
selection-text=ffffffff
selection-match=ffffffff
border=3a3a3aff

[border]
width=2
radius=16
