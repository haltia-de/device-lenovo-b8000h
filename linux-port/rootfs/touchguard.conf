# b8k-touchguard: what counts as a deliberate touch. Installed as
# /etc/b8k/touchguard.conf; after a change: rc-service b8k-touchguard restart.
# Switched off altogether with: rc-service b8k-touchguard stop;
# rc-update del b8k-touchguard (back on: rc-update add b8k-touchguard
# sysinit; rc-service b8k-touchguard start).
#
# A touch counts once it has lasted this long (ms); a shorter brush of the
# glass is dropped. A finger's tap here lasts 75-120 ms.
hold_ms = 60
# A new touch this soon (ms, from the last lift) and this near (screen
# units, 150 is some 86 px) is a tremor's second strike: dropped.
repeat_ms = 400
repeat_radius = 150
# A palm: a contact this large (of 15) or this hard (of 255), or this many
# contacts at once. A finger is size 5, pressure ~48; a palm 12-15, 120-143.
palm_major = 11
palm_pressure = 100
palm_contacts = 3
# After a palm, the screen stays still this long once it is lifted (ms).
palm_grace_ms = 300
# A tap buzzes the motor this long (ms): the tap feedback for every
# program. 0: no buzz. Pulses under about 50 ms are not felt.
buzz_ms = 70
# A touch that moves farther than this (screen units; 80 is some 46 px) is a
# scroll or a drag and does not buzz.
tap_radius = 80
# A finger held still this long (ms) buzzes once then: a long press.
long_ms = 600
