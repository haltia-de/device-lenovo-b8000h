[device]
wifi.backend=wpa_supplicant
wifi.scan-rand-mac-address=no

# wlan_mt6628 finds no factory MAC (Android keeps it in NVRAM) and makes
# up a new one each time it loads, so DHCP gave a new address on every
# boot. "stable" derives the MAC from /etc/machine-id and the network.
[connection]
wifi.cloned-mac-address=stable
