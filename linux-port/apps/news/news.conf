# News from RSS feeds, the story read inside the program.
# Installed as /usr/local/share/b8k/apps.d/news.conf; b8k-apps adds it to
# the shell's programs (fields: see /usr/local/share/b8k/apps.conf).
[news]
label = Новости
icon = /usr/local/share/b8k/news.svg
signal = 6
app_ids = b8k.News b8k-news
exec = b8k-news
