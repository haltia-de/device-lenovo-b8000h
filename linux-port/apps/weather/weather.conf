# Gismeteo's forecast for a city chosen in the program.
# Installed as /usr/local/share/b8k/apps.d/weather.conf; b8k-apps adds it to
# the shell's programs (fields: see /usr/local/share/b8k/apps.conf).
[weather]
label = Погода
icon = /usr/local/share/b8k/weather.svg
signal = 5
app_ids = b8k.Weather b8k-weather
exec = b8k-weather
